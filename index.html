<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
    <title>sac-md-editor</title>
    <!-- The add-on's API page (GitHub Pages start page), from the kit's
         templates/showcase.html. showcase.css is the page look; sac.showcase
         writes the markup. Classic ordered defer, no build step. -->
    <link rel="stylesheet" href="kit/css/ui.css">
    <link rel="stylesheet" href="kit/css/showcase.css">

    <script defer src="kit/js/lib/globals.js"></script>
    <script defer src="kit/js/i18n/de.js"></script>
    <script defer src="kit/js/lib/icons.js"></script>
    <script defer src="kit/js/lib/showcase.js"></script>
    <script defer src="kit/js/components/sac-icon.js"></script>
    <script defer src="kit/js/components/sac-nav.js"></script>
    <script defer src="kit/js/components/sac-theme-toggle.js"></script>
    <script defer src="kit/js/components/sac-lang-toggle.js"></script>
    <!-- The add-on: marked + DOMPurify as globals (the kit ships both), the
         editor, and the :::secret registration after it. -->
    <script defer src="kit/js/vendor/marked.min.js"></script>
    <script defer src="kit/js/vendor/purify.min.js"></script>
    <script defer src="js/sac-md-editor.js"></script>
    <script defer src="js/sac-md-secret.js"></script>

    <style>
        /* Size only - border, radius and focus ring are the component's own,
           so the demo shows what every host gets. */
        #editor { display: block; min-height: 420px; }
        .demo-actions { flex-wrap: wrap; margin-top: 1rem; }
        /* The pane a bare editor fills - the frame is the demo's, not the editor's. */
        .bare-pane { display: flex; flex-direction: column; height: 260px;
                     border: 1px dashed var(--border); }
        .bare-pane sac-md-editor { flex: 1; }
    </style>
</head>
<body class="app-page">
    <sac-nav brand="sac-md-editor" brand-icon="pencil"
             brand-href="https://sacrvm.github.io/sacrvm-appkit/#/styleguide/addons">
        <div slot="context">
            <sac-lang-toggle></sac-lang-toggle>
            <sac-theme-toggle></sac-theme-toggle>
        </div>
    </sac-nav>

    <div class="main-layout">
        <div class="app-scroll">
            <div class="sg-page" id="page"></div>
        </div>
    </div>

    <script defer>
        document.addEventListener("DOMContentLoaded", () => {
            const { code, table, compact, note } = sac.showcase;
            const page = document.getElementById("page");
            page.innerHTML = `
                <h1>&lt;sac-md-editor&gt;</h1>
                <p class="lead">Obsidian-style live-preview markdown editing: the line your
                   caret sits on is raw source, every other line renders. No mode switch,
                   no build step. Needs <code>marked</code> and <code>DOMPurify</code> as
                   globals - the kit ships both; this page runs on SACRVM APPKIT
                   <span id="kit-version">(see kit/VERSION)</span>.</p>

                <div class="sg-demo">
                    <sac-md-editor id="editor" placeholder="Write some markdown..."></sac-md-editor>
                    <div class="toolbar demo-actions">
                        <button class="btn" id="dump">Log value to console</button>
                        <button class="btn" id="ro">Toggle readonly</button>
                    </div>
                </div>

                <h2 id="use">Use</h2>
                <p>Vendor <code>js/</code> beside your kit and load the editor after
                   <code>marked</code> and <code>DOMPurify</code>.
                   <code>sac-md-secret.js</code> is optional and goes after the editor.</p>
                ${code(`<link rel="stylesheet" href="kit/css/ui.css">
<script defer src="kit/js/vendor/marked.min.js"><\/script>
<script defer src="kit/js/vendor/purify.min.js"><\/script>
<script defer src="js/sac-md-editor.js"><\/script>
<script defer src="js/sac-md-secret.js"><\/script>  <!-- optional: :::secret -->

<sac-md-editor placeholder="Write..."></sac-md-editor>`)}
                <p>Styling lives in the shadow root but reads the kit's seed tokens
                   (<code>--fg</code>, <code>--field</code>, <code>--accent</code>,
                   <code>--text</code>, <code>--border</code>, ...), so the editor rethemes
                   with the page in light and dark. Every token has a dark fallback, so it
                   also runs without the kit.</p>

                <h2 id="api">API</h2>
                ${table("Attribute", [
                    ["placeholder", "Shown while the document is empty. Your string - translate it on your side."],
                    ["readonly", "Disables editing and hides the toolbar. A click or tap on a masked block reveals / hides it."],
                    ["bare", "For an editor that is the whole pane: no frame, radius, background or focus ring, and the writing surface fills the host's height. Give the host one (a height, or <code>flex: 1</code> in a column); a click below the text puts the caret at the end."],
                ])}
                ${table("Property", [
                    ["value", "The markdown source, getter and setter. A programmatic set fires no event."],
                ])}
                ${table("Event", [
                    ["sac:input", "<code>detail { value }</code> once after every edit that changed the value (keystroke, paste, toolbar, undo/redo, table re-alignment). Bubbles, not composed."],
                    ["sac:change", "<code>detail { value }</code> when focus leaves after an edit. Bubbles, not composed."],
                    ["input / change", "Legacy native events, still fired for older hosts. <code>input</code> can arrive twice per keystroke."],
                ])}
                ${table("Method", [
                    ["focus()", "Focuses the editing surface."],
                ])}
                ${table("Keyboard", [
                    ["Ctrl/Cmd+B / I / K", "Bold / italic / link."],
                    ["Enter", "Splits the line; continues <code>- * + 1. 1)</code> lists. On an empty item it leaves the list."],
                    ["Backspace", "At the start of a line: merges it into the line above."],
                    ["Tab", "Two-space soft tab."],
                    ["Tab / Shift+Tab (table)", "Next / previous cell; past the last cell adds a row."],
                    ["Enter / Esc (table)", "Enter adds a row below (on an empty row it leaves); Esc leaves the table. Leaving re-aligns the pipes - an undoable edit."],
                ])}
                <p>With the caret in a table, the toolbar's Table button opens a grid
                   dialog (<code>part="table-dialog"</code>) to add, delete and move columns
                   and rows and set alignment.</p>

                <h2 id="bare-mode">Bare</h2>
                <p>When the editor is the whole pane (a notes app) rather than a field in
                   a form, <code>bare</code> drops the frame and lets the writing surface
                   fill the host's height. Here in a 260px pane - the dashed line is the
                   pane, not the editor:</p>
                <div class="sg-demo">
                    <div class="bare-pane">
                        <sac-md-editor id="bare" bare placeholder="A sheet of paper..."></sac-md-editor>
                    </div>
                </div>
                ${code(`<div style="display: flex; flex-direction: column; height: 100%">
    <sac-md-editor bare style="flex: 1"></sac-md-editor>
</div>`)}

                <h2 id="blocks">Blocks</h2>
                <p>The editor knows no block names of its own. A page registers them once on
                   the element class, and every editor on it picks them up live.</p>
                ${code(`const Editor = customElements.get("sac-md-editor");
const off = Editor.registerBlock({
    name:   "note",
    open:   /^:::note(\\s|$)/,
    close:  /^:::end(\\s|$)/,
    label:  "Note",          // pill on the opening line (or a function)
    color:  "#3b82f6",       // card tint
    masked: false,           // true: body blurred until revealed
    toggle: false,           // true: eye button on the opening line
    css:    ".line.block-note.block-body { font-style: italic; }",
});
off();                       // or Editor.unregisterBlock("note")`)}
                ${table("Static", [
                    ["registerBlock(def)", "Adds a block for every editor on the page; returns an unregister function."],
                    ["unregisterBlock(name)", "Removes it again."],
                    ["blocks", "The registered names."],
                ])}
                ${table("Definition", [
                    ["name", "<code>a-z 0-9 -</code>, unique."],
                    ["open / close", "RegExps for the opening and closing line."],
                    ["match(src)", "Instead of open/close: returns <code>\"open\"</code>, <code>\"close\"</code>, <code>\"line\"</code> (a one-line block) or null."],
                    ["masked", "Body lines blurred until revealed."],
                    ["toggle", "Eye button on the opening line, session-only reveal."],
                    ["label", "Pill text on the opening line, a string or a function (for the page language)."],
                    ["className", "Extra class on every line of the block."],
                    ["color", "Card tint; warm by default."],
                    ["css", "Injected into every editor's shadow root - the one way to style a block from outside."],
                ])}
                <p>Blocks are recognised outside code fences only, do not nest, and render
                   inline markdown in their body. <code>js/sac-md-secret.js</code> registers
                   <code>:::secret</code> ... <code>:::end</code> (two or three colons on
                   read): blurred, with the eye toggle.</p>
                ${note("<b>Security:</b> the blur is a courtesy against shoulder-surfing, not a security boundary. The plaintext stays in the DOM and in whatever you save from <code>value</code>. If secrets must stay out of an index, an agent or a wire, the host has to enforce that server-side. Do not build on the blur.")}

                <h2 id="lang">Language</h2>
                <p>The editor's own strings (toolbar, reveal toggle, link prompt, the
                   <code>:::secret</code> pill) follow <code>sac.lang</code> live, without
                   re-rendering the document. It ships German; other languages go in through
                   <code>sac.i18n.add(lang, { "md-editor.bold": ... })</code>. Without the
                   kit's <code>globals.js</code> it stays English.</p>

                ${compact("no separate phone layout. A tap puts the caret on a line and shows its source; in read-only mode a tap on a masked block reveals it.")}`;
            sac.showcase.watchCode(page);

            // Read the vendored version so a re-vendor never leaves this text stale.
            fetch("kit/VERSION").then(r => r.ok ? r.text() : Promise.reject())
                .then(v => { document.getElementById("kit-version").textContent = v.trim(); })
                .catch(() => {});

            const ed = document.getElementById("editor");
            ed.value = [
                "# Hello",
                "",
                "The line your **caret** sits on shows as raw markdown; every other",
                "line renders. Try *italics*, `inline code`, and [links](https://example.com).",
                "",
                "- Lists continue on Enter",
                "- Enter on an empty item exits the list",
                "",
                "| Key | Does |",
                "| --- | --- |",
                "| Tab | next cell |",
                "| Esc | leaves the table |",
                "",
                "```",
                "code fences are left alone - :::secret in here is just text",
                "```",
                "",
                ":::secret",
                "Blurred until you click the eye on the boundary line.",
                "Session-only, purely visual - see the security note below.",
                ":::end",
                "",
                "> The canonical document is the concatenated textContent of the",
                "> line divs. Round-tripping is trivial because nothing is ever",
                "> synthesized or deleted.",
            ].join("\n");
            document.getElementById("bare").value =
                "# A short note\n\nClick anywhere below it: the caret goes to the end.";

            document.getElementById("dump").addEventListener("click",
                () => console.log(ed.value));
            document.getElementById("ro").addEventListener("click",
                () => ed.toggleAttribute("readonly"));
        });
    </script>
</body>
</html>
